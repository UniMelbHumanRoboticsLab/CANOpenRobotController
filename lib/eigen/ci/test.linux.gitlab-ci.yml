##### CUDA #####################################################################
.test:linux:cuda:
  extends: .test:linux
  allow_failure: true
  variables:
    EIGEN_CI_CTEST_LABEL: gpu
    # nvcc-linked binaries are not bit-reproducible, so the content-addressed
    # pass cache could never hit here. cache: [] also drops the inherited
    # stanza.
    EIGEN_CI_TEST_CACHE: "off"
  cache: []
  rules: !reference [.rules:libeigen:gpu, rules]
  # Name the GPU and driver the job landed on before anything else; the log is
  # the record of which tagged runner handled it.
  before_script:
    - nvidia-smi
    - . ci/scripts/common.linux.before_script.sh
  # The oldest CUDA jobs inherit this GitLab SaaS T4 (sm_75) tag. Newer jobs
  # override it through .test:linux:cuda:l4 below.
  tags:
    - saas-linux-medium-amd64-gpu-standard

.test:linux:cuda:l4:
  extends: .test:linux:cuda
  tags:
    - eigen-linux-cuda-l4

