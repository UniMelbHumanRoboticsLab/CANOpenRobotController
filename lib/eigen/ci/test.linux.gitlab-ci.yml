.test:linux:
  extends: [ .common:linux:cross, .artifacts:test:results ]
  stage: test
  variables:
    # Content-addressed pass cache toggle and manifest location, read by
    # test.linux.script.sh; the cache stanza below persists the directory.
    EIGEN_CI_TEST_CACHE: "on"
    EIGEN_CI_TEST_CACHE_DIR: ${CI_PROJECT_DIR}/.testcache
  script:
    - . ci/scripts/test.linux.script.sh
  after_script:
    - . ci/scripts/test.linux.after_script.sh
  rules: !reference [.rules:libeigen:all-tests, rules]
  tags:
    - saas-linux-2xlarge-amd64
  allow_failure:
    exit_codes: 42
  # Pass-cache manifest consumed by test.linux.script.sh.  One shared pool per
  # job name, deliberately unscoped where the build jobs' ccache is now keyed
  # per merge request: `test_cache.py record` merges its entries into the
  # restored manifest instead of replacing a directory, so concurrent merge
  # requests add to this cache rather than overwrite each other.  Merge-request
  # pipelines are the only writers (the script no-ops elsewhere), so scheduled
  # full-matrix runs keep their seed diversity.
  cache:
    key: "$CI_JOB_NAME_SLUG-testcache"
    paths:
      - .testcache/
    when: always

